<style>
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #6063ee;
            border-radius: 50%;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }
        .soft-glow {
            box-shadow: 0 16px 32px -8px rgba(96, 99, 238, 0.15);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center overflow-hidden">
<!-- Celebration Overlay/Modal -->
<main class="relative w-full max-w-lg mx-auto p-grid-margin z-10 flex flex-col items-center text-center">
<!-- Illustration -->
<div class="mb-stack-lg relative w-64 h-64 rounded-full bg-surface-container flex items-center justify-center soft-glow">
<img class="w-48 h-48 object-contain" data-alt="A soft, abstract 3D illustration of a blooming flower in pastel blue and purple tones, symbolizing growth and completion, set against a pristine, airy light-mode background. The lighting is gentle and diffused, evoking a sense of calm and accomplishment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXXFAPYbRuWOdrYa5t38cJp4l2jYkqz30OVipQHWEEhDUkC_Btzp2G9U3xTT9h0RraJxpI3U0Zd79JTw_izY9ZTOty-bm64Q_uPCi_V6Sq0pwfHZGOLp0s2F9tZhIc5RhPT_ICfOD0FQHDHKlESJg6nGF8ltYI2Tf9qS9fM8mKeYYr6R1746y9BqOJ_fssWhxiUFQvql--zraHUUIegyCu5sKLxE4BBGG-xnMZ1MJJ1hUR_DBMEYNXUw"/>
</div>
<!-- Headline & Message -->
<h1 class="font-display text-display text-primary mb-stack-sm">¡Mente Despejada!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg">
            Has completado todas las tareas de la carpeta <span class="font-semibold text-on-surface">Proyecto Alpha</span>
</p>
<!-- Stats Bento -->
<div class="grid grid-cols-2 gap-grid-gutter w-full mb-stack-lg">
<div class="bg-surface-container-low rounded-xl p-stack-md flex flex-col items-center justify-center border border-surface-variant">
<span class="material-symbols-outlined text-primary text-3xl mb-base" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-headline-md text-headline-md text-on-surface">2h 15m</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Tiempo ahorrado</span>
</div>
<div class="bg-surface-container-low rounded-xl p-stack-md flex flex-col items-center justify-center border border-surface-variant">
<span class="material-symbols-outlined text-primary text-3xl mb-base" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-md text-headline-md text-on-surface">14</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Tareas completadas</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-stack-sm sm:flex-row sm:justify-center">
<button class="bg-primary text-on-primary font-label-md text-label-md px-6 py-3 rounded-full hover:bg-primary-fixed-dim transition-colors flex items-center justify-center gap-2 w-full sm:w-auto">
<span class="material-symbols-outlined">celebration</span>
                Celebrate &amp; Continue
            </button>
<button class="bg-transparent text-primary font-label-md text-label-md px-6 py-3 rounded-full hover:bg-surface-container-low transition-colors border border-outline-variant w-full sm:w-auto">
                Go to Agenda
            </button>
</div>
</main>
<!-- Confetti Script -->
<script>
        const colors = ['#6063ee', '#4648d4', '#c0c1ff', '#e1e0ff', '#ffb2b7'];
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti-piece');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = -10 + 'vh';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 2) + 's';
            
            // Randomize shape (circle or square)
            if(Math.random() > 0.5) confetti.style.borderRadius = '0';
            
            document.body.appendChild(confetti);
        }
    </script>
</body></html>
