<style>
        .success-animation {
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.8);
        }
        
        .fade-up {
            animation: fadeUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .fade-up-delay-1 { animation-delay: 0.2s; }
        .fade-up-delay-2 { animation-delay: 0.4s; }
        .fade-up-delay-3 { animation-delay: 0.6s; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(70, 72, 212, 0.2);
            animation: pulse 2s infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-fixed-dim/20 blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-tertiary-fixed/30 blur-3xl"></div>
</div>
<!-- Main Content Canvas -->
<div class="relative z-10 w-full max-w-md px-grid-margin py-stack-lg bg-surface-container-lowest rounded-xl shadow-[0_8px_32px_rgba(70,72,212,0.08)] mx-4">
<!-- Success Icon Container -->
<div class="flex flex-col items-center mb-stack-lg relative">
<div class="relative w-24 h-24 flex items-center justify-center success-animation">
<div class="pulse-ring"></div>
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center text-on-primary-container shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mt-stack-md text-center fade-up fade-up-delay-1">Idea Scheduled</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-stack-sm fade-up fade-up-delay-1">Your concept has been successfully added to your timeline.</p>
</div>
<!-- Integration Preview Card -->
<div class="bg-surface-container-low rounded-lg p-stack-md mb-stack-lg border border-outline-variant/30 fade-up fade-up-delay-2 relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<div class="flex items-center justify-between mb-stack-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-label-md text-label-md text-primary">Q3 Marketing Brainstorm</span>
</div>
<span class="bg-surface-container-highest text-on-surface font-label-sm text-label-sm px-2 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span>
                    Today, 2:00 PM
                </span>
</div>
<div class="pl-7">
<p class="font-body-sm text-body-sm text-on-surface-variant">Allocated 90 minutes for deep work and initial concept outlining.</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-md fade-up fade-up-delay-3">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-surface-tint transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">calendar_month</span>
                Go to Calendar
            </button>
<button class="w-full bg-surface-container-lowest text-primary border border-primary/30 font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-surface-container transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">lightbulb</span>
                Keep Ideating
            </button>
</div>
